{% extends 'base.html' %}
{% block page_title %}{{ 'Editar cliente SaaS' if tenant else 'Nova empresa' }}{% endblock %}
{% block content %}
<form method="post" enctype="multipart/form-data" class="panel-card" style="max-width:1000px"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Nome da empresa</label><input class="form-control" name="company_name" value="{{ tenant.company_name if tenant else '' }}" required></div>
    <div class="col-md-6"><label class="form-label">Slug</label><input class="form-control" name="slug" value="{{ tenant.slug if tenant else '' }}" {{ 'readonly' if tenant else '' }} required></div>
    {% if not tenant %}
    <div class="col-md-4"><label class="form-label">Nome do admin</label><input class="form-control" name="admin_full_name"></div>
    <div class="col-md-4"><label class="form-label">Usuário do admin</label><input class="form-control" name="admin_username" required></div>
    <div class="col-md-4"><label class="form-label">Senha do admin</label><input class="form-control" name="admin_password" required></div>
    <div class="col-md-4"><label class="form-label">Status inicial</label><select class="form-select" name="subscription_status"><option value="trial">Teste grátis</option><option value="active">Ativo</option><option value="courtesy">Cortesia</option></select></div>
    <div class="col-md-4"><label class="form-label">Dias de teste</label><input class="form-control" type="number" name="trial_days" value="7"></div>
    {% else %}
    <div class="col-md-4"><label class="form-label">Status</label><select class="form-select" name="subscription_status">
      {% for status in ['trial','active','expired','blocked','courtesy'] %}
      <option value="{{ status }}" {% if tenant.subscription_status==status %}selected{% endif %}>{{ status }}</option>
      {% endfor %}
    </select></div>
    <div class="col-md-4"><label class="form-label">Acesso pago até</label><input class="form-control" type="date" name="subscription_ends_on" value="{{ tenant.subscription_ends_on.isoformat() if tenant.subscription_ends_on else '' }}"></div>
    <div class="col-md-4"><label class="form-label">Teste até</label><input class="form-control" type="date" name="trial_ends_on" value="{{ tenant.trial_ends_on.isoformat() if tenant.trial_ends_on else '' }}"></div>
    <div class="col-md-6"><label class="form-label">Logotipo</label><input type="file" class="form-control" name="brand_logo" accept=".png,.jpg,.jpeg,.webp,.svg"></div>
    <div class="col-md-3"><label class="form-label">Conta ativa</label><select class="form-select" name="is_active"><option value="1" {% if tenant.is_active %}selected{% endif %}>Sim</option><option value="0" {% if not tenant.is_active %}selected{% endif %}>Não</option></select></div>
    <div class="col-md-3"><label class="form-label">Cortesia</label><select class="form-select" name="is_courtesy"><option value="1" {% if tenant.is_courtesy %}selected{% endif %}>Sim</option><option value="0" {% if not tenant.is_courtesy %}selected{% endif %}>Não</option></select></div>
    {% endif %}
  </div>
  <div class="mt-4"><button class="btn btn-primary doc-action-btn">{{ 'Salvar alterações' if tenant else 'Criar cliente SaaS' }}</button></div>
</form>
{% endblock %}
